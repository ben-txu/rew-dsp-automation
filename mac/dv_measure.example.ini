# ═══════════════════════════════════════════════════════════════════
#  dv_measure.ini — configuration for dv_speaker_measure.py
#
#  Copy this file to dv_measure.ini (same folder as the script) and
#  adjust it to your install. Search order:
#    1. path given via --config <file>
#    2. dv_measure.ini next to the script
#    3. ~/.config/dv-measure/dv_measure.ini
#
#  Lines starting with # are comments. Channels can be excluded from
#  a run by commenting them out.
# ═══════════════════════════════════════════════════════════════════

[connection]
# REW API on the Mac (default port 4735, enable in REW Preferences → API)
rew_base = http://localhost:4735

# Solo/mute bridge.
# PC-Tool in a Windows VM: HTTP→AutoHotkey bridge inside the VM. Find the
# VM's IP with `ipconfig` inside Windows; give the VM a static IP so it
# never changes (see README).
# Native macOS PC-Tool: run mac/pctool_bridge_mac.py and use
#   solo_bridge = http://localhost:4737
solo_bridge = http://10.211.55.200:4737

# Local port on which this script receives REW's sweep-completion POST
callback_port = 4736

[calibration]
# Path to your microphone calibration file. Three modes:
#   <path>  → enforce this cal file (set it if needed, abort otherwise)
#   empty   → don't touch REW's calibration at all
#   none    → enforce measuring WITHOUT a cal file (clears it in REW)
mic_cal_file =

[naming]
# Placeholders: {session} {channel} {mode} {date} {time} {datetime}
# Examples:
#   {session}_{channel}          → PreEQ_Driver_FL_Tweeter
#   {channel}_{session}          → FL_Tweeter_PreEQ_Driver
#   {date}_{session}_{channel}   → 2026-07-06_PreEQ_Driver_FL_Tweeter
name_template = {session}_{channel}

# Folder for the final .mdat file (~ expands to your home directory)
output_dir = ~/Desktop

[sweep]
# Safety-net timeout per sweep, seconds
timeout_s = 120

[rta]
# Defaults for channels WITHOUT a type assignment
default_averages = 128
fft_length = 64k
mode = RTA 1/48 octave
# Use REW's signal generator during RTA? Set false if you play the
# test signal externally (e.g. pink noise from the head unit).
use_generator = false
generator_signal = pinkpn
# Hard upper limit in seconds if the target average count is never hit
timeout_s = 300

[timing]
# Settle time after solo switching before the measurement starts, seconds
dsp_settle_s = 0.4

[types]
# Measurement types: type = FFT length, target averages[, generator signal]
# The optional third field only matters with use_generator = true; it
# overrides [rta] generator_signal for channels of that type. Check the
# exact signal names your REW build offers:
#   curl http://localhost:4735/generator/signals
# Names are free-form; channels reference them below.
# Rationale for the defaults: at 93.75% RTA overlap the statistically
# independent information depends only on the average count, so equal
# counts give equal quality — larger FFTs (finer low-frequency
# resolution) just take proportionally longer per channel.
tweeter = 64k, 128
mid     = 128k, 128
woofer  = 256k, 128

[pairs]
# Optional: named channel groups measured together (unmuted as a set,
# no solo involved). Members must be channels 1–16. A trailing token
# that names a [types] entry sets the group's FFT/averages explicitly;
# otherwise a uniform member type is used, else the [rta] defaults.
# Select at startup or via --scope pairs [--only <group>].
# Tweeters = FL_Tweeter, FR_Tweeter

[branches]
# Same syntax — meant for whole sides, e.g. a full three-way branch:
# FrontLeft = FL_Tweeter, FL_Mid, FL_Woofer, woofer

[channels]
# name = DSP channel number (1–20)[, type]
# Order here = measurement order. Type is optional; channels without
# one use the [rta] defaults and trigger the averages prompt.
FL_Tweeter = 1, tweeter
FR_Tweeter = 2, tweeter
FL_Mid     = 3, mid
FR_Mid     = 4, mid
FL_Woofer  = 5, woofer
FR_Woofer  = 6, woofer
Sub        = 7, woofer
